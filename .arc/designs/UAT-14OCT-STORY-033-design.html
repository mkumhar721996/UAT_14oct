<!-- Screen 2: Report a Defect -->
<!-- Notes:
     - Required: Title, Description, Severity, Steps to reproduce (AC1, AC2). Each left empty
       is rejected individually with its own named message (AC2), and the user's other entries
       are preserved — nothing is cleared or re-rendered away.
     - Severity select lists exactly Critical / High / Medium / Low (AC4).
     - Optional: Expected result, Actual result, Environment/build version — all three can stay
       empty and the defect still saves (AC3).
     - Authorization is checked before field validation: a non-Reporter's submission is always
       refused with an authorization error, regardless of what they filled in (AC6).
     - On success, the record is shown immediately with Status: New (AC5), including "Not set"
       for any optional field left blank.
-->

<script>
/* ============================================================
   Fixture data — everything lives in memory for this prototype
   ============================================================ */
const DEFECT_FIXTURES = {
  defects: [
    {
      id: 'DEF-241', title: 'Checkout button unresponsive on Safari', severity: 'Critical', status: 'New',
      reporter: 'Jordan Blake', createdAt: '2026-10-13T09:15:00',
      description: 'Tapping "Place order" does nothing in Safari on iOS; no error and no network request fires.',
      steps: '1. Add any item to the cart\n2. Go to checkout\n3. Fill in payment details\n4. Tap "Place order" on Safari iOS',
      expected: 'The order is placed and the confirmation screen appears.',
      actual: 'Nothing happens. No error message, no loading state.',
      environment: 'iOS 17.4, Safari, production'
    },
    {
      id: 'DEF-238', title: 'Search results pagination skips page 2', severity: 'Medium', status: 'In triage',
      reporter: 'Priya Shah', createdAt: '2026-10-10T14:02:00',
      description: 'Clicking "Next" from page 1 of search results jumps straight to page 3.',
      steps: '1. Search for "invoice"\n2. Click "Next" on the results list',
      expected: '', actual: '', environment: ''
    },
    {
      id: 'DEF-230', title: 'Export CSV missing header row', severity: 'Low', status: 'Resolved',
      reporter: 'Marcus Webb', createdAt: '2026-10-02T11:40:00',
      description: 'CSV export from the Reports page has no column headers, just raw data.',
      steps: '1. Go to Reports\n2. Export as CSV\n3. Open the file',
      expected: 'The first row contains column names.',
      actual: 'The first row is already data.',
      environment: 'Chrome 128, staging'
    }
  ],
  nextIdNumber: 242
};

const SEVERITIES = [
  { value: 'Critical', icon: '⛔', cls: 'sev-critical' },
  { value: 'High', icon: '▲', cls: 'sev-high' },
  { value: 'Medium', icon: '◆', cls: 'sev-medium' },
  { value: 'Low', icon: '▽', cls: 'sev-low' }
];

const REQUIRED_FIELDS = [
  { key: 'title', label: 'Title', message: 'Enter a title for the defect.' },
  { key: 'description', label: 'Description', message: 'Describe the defect.' },
  { key: 'severity', label: 'Severity', message: 'Choose a severity.' },
  { key: 'steps', label: 'Steps to reproduce', message: 'Describe the steps to reproduce the defect.' }
];

let state = { role: 'reporter' };

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDateTime(iso) { const d = new Date(iso); return d.toLocaleString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function severityMeta(value) { return SEVERITIES.find(s => s.value === value) || SEVERITIES[2]; }
function severityTag(value) {
  const s = severityMeta(value);
  return `<span class="severity-tag ${s.cls}"><span aria-hidden="true">${s.icon}</span>${s.value}</span>`;
}
function statusChip(value) {
  return `<span class="chip chip-neutral">${escapeHtml(value)}</span>`;
}
function reporterName(role) { return role === 'reporter' ? 'Jordan Blake' : 'Sam Ortiz'; }

function showToast(message, type) {
  const wrap = $('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'danger' ? ' toast-danger' : '');
  el.textContent = message;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 220); }, 3200);
}

function sidebarHtml(role) {
  const newCount = DEFECT_FIXTURES.defects.filter(d => d.status === 'New').length;
  const badge = newCount > 0 ? `<span class="sidebar-badge">${newCount}</span>` : '';
  return `
    <div class="sidebar-section-label">QA Tracker</div>
    <a class="sidebar-link is-active" data-nav="0">Defects${badge}</a>
  `;
}

/* ============================================================
   Screen navigation (reviewer bar)
   ============================================================ */
const screens = Array.from(document.querySelectorAll('.screen'));
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(screens.length - 1, i));
  screens.forEach((s, j) => s.style.display = j === cur ? 'block' : 'none');
  document.getElementById('screen-label').textContent = `${cur + 1} / ${screens.length}: ${screens[cur].dataset.name}`;
  window.scrollTo(0, 0);
}
document.getElementById('prev-btn').onclick = () => show(cur - 1);
document.getElementById('next-btn').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { show(parseInt(nav.dataset.nav, 10)); }
});

/* ============================================================
   Role switcher (syncs the two selects that appear per screen)
   ============================================================ */
function syncRoleSelects() {
  ['role-select-1', 'role-select-2'].forEach(id => { const el = $(id); if (el) el.value = state.role; });
}
['role-select-1', 'role-select-2'].forEach(id => {
  document.addEventListener('change', e => {
    if (e.target.id === id) { state.role = e.target.value; syncRoleSelects(); renderList(false); resetNewDefectForm(); }
  });
});

/* ============================================================
   Screen 1: Defects list
   ============================================================ */
let listFilter = '';
function renderList(loading) {
  $('sidebar-list').innerHTML = sidebarHtml(state.role);
  $('list-role-note').innerHTML = state.role !== 'reporter'
    ? `<div class="banner banner-warning"><span class="banner-icon">&#9888;</span><div><strong>You're signed in without the Reporter role</strong>You can browse defects, but submitting a new one will be refused. Switch to Jordan Blake above to report a defect.</div></div>`
    : '';

  $('list-error').style.display = 'none';
  const tbody = $('list-rows');
  const table = $('list-table');

  if (loading) {
    table.style.display = '';
    $('list-empty').style.display = 'none';
    tbody.innerHTML = '<!-- State: loading -->' + Array.from({ length: 3 }).map(() => `
      <tr class="skeleton-row">
        <td><div class="skeleton skeleton-line" style="width:70px"></div></td>
        <td><div class="skeleton skeleton-line" style="width:220px"></div></td>
        <td><div class="skeleton skeleton-line" style="width:80px"></div></td>
        <td><div class="skeleton skeleton-line" style="width:70px"></div></td>
        <td><div class="skeleton skeleton-line" style="width:110px"></div></td>
        <td><div class="skeleton skeleton-line" style="width:120px"></div></td>
      </tr>`).join('');
    return;
  }

  const q = listFilter.trim().toLowerCase();
  const rows = DEFECT_FIXTURES.defects.filter(d =>
    !q || d.title.toLowerCase().includes(q) || d.id.toLowerCase().includes(q)
  );

  if (rows.length === 0) {
    table.style.display = 'none';
    $('list-empty').style.display = 'block';
    $('list-empty').innerHTML = `
      <!-- State: empty -->
      <div class="empty-state">
        <div class="glyph">&#128269;</div>
        <p><strong>No defects match "${escapeHtml(listFilter)}"</strong></p>
        <p class="text-muted">Try a different title or defect ID, or report a new defect.</p>
      </div>`;
    return;
  }

  table.style.display = '';
  $('list-empty').style.display = 'none';
  tbody.innerHTML = (q ? '<!-- State: partial (filtered) -->' : '<!-- State: success -->') + rows.map(d => `
    <tr>
      <td style="font-family:var(--font-family-mono)">${d.id}</td>
      <td>${escapeHtml(d.title)}</td>
      <td>${severityTag(d.severity)}</td>
      <td>${statusChip(d.status)}</td>
      <td>${escapeHtml(d.reporter)}</td>
      <td class="text-muted">${fmtDateTime(d.createdAt)}</td>
    </tr>`).join('');
}

$('list-search').addEventListener('input', e => { listFilter = e.target.value; renderList(false); });

$('btn-new-defect').addEventListener('click', () => { resetNewDefectForm(); show(1); });

$('btn-simulate-error').addEventListener('click', () => {
  $('list-table').style.display = 'none';
  $('list-empty').style.display = 'none';
  const err = $('list-error');
  err.style.display = 'block';
  err.innerHTML = `
    <!-- State: error -->
    <div class="banner banner-danger" style="margin:0;">
      <span class="banner-icon">&#9888;</span>
      <div><strong>Couldn't load defects</strong>The defect service didn't respond in time. Check your connection and try again.</div>
    </div>
    <div style="margin-top:var(--space-3)"><button class="btn btn-secondary" id="btn-retry-list">Retry</button></div>`;
  $('btn-retry-list').addEventListener('click', () => renderList(false));
});

/* ============================================================
   Screen 2: Report a Defect
   ============================================================ */
let newDefectDraft = {};
function resetNewDefectForm() {
  newDefectDraft = { title: '', description: '', severity: '', steps: '', expected: '', actual: '', environment: '' };
  renderNewDefectScreen();
}

function renderNewDefectScreen(savedDefect) {
  $('sidebar-new').innerHTML = sidebarHtml(state.role);
  const root = $('new-defect-content');
  const isReporter = state.role === 'reporter';

  if (savedDefect) {
    root.innerHTML = successStateHtml(savedDefect);
    $('btn-view-in-list').addEventListener('click', () => { renderList(false); show(0); });
    $('btn-report-another').addEventListener('click', () => resetNewDefectForm());
    return;
  }

  const roleNote = !isReporter
    ? `<div class="banner banner-warning"><span class="banner-icon">&#9888;</span><div><strong>Submitting will be refused</strong>You're signed in as ${escapeHtml(reporterName(state.role))}, who doesn't have the Reporter role. You can fill in the form, but it won't be saved.</div></div>`
    : '';

  root.innerHTML = `
    <!-- State: ${isReporter ? 'pristine' : 'limited-access'} -->
    ${roleNote}
    <div id="new-defect-summary-error" aria-live="assertive" role="alert"></div>
    <div class="card" style="max-width:720px;">
      <h3 class="card-title">Defect details</h3>
      <p class="card-body" style="margin-top:-6px;">Title, description, severity and steps to reproduce are required so QA can triage this defect.</p>
      <form id="new-defect-form" novalidate>
        <div class="field">
          <label class="field-label" for="nd-title">Title<span class="required-mark">*</span></label>
          <input class="input" id="nd-title" type="text" placeholder="e.g. Checkout button unresponsive on Safari" value="${escapeHtml(newDefectDraft.title || '')}" aria-describedby="err-title" />
          <div class="field-error" id="err-title" style="display:none;"></div>
        </div>
        <div class="field">
          <label class="field-label" for="nd-description">Description<span class="required-mark">*</span></label>
          <textarea class="textarea" id="nd-description" placeholder="What's wrong, and where does it happen?" aria-describedby="err-description">${escapeHtml(newDefectDraft.description || '')}</textarea>
          <div class="field-error" id="err-description" style="display:none;"></div>
        </div>
        <div class="field">
          <label class="field-label" for="nd-severity">Severity<span class="required-mark">*</span></label>
          <select class="select" id="nd-severity" aria-describedby="err-severity">
            <option value="">Select severity</option>
            ${SEVERITIES.map(s => `<option value="${s.value}" ${newDefectDraft.severity === s.value ? 'selected' : ''}>${s.value}</option>`).join('')}
          </select>
          <div class="field-error" id="err-severity" style="display:none;"></div>
        </div>
        <div class="field">
          <label class="field-label" for="nd-steps">Steps to reproduce<span class="required-mark">*</span></label>
          <textarea class="textarea" id="nd-steps" placeholder="1. ...&#10;2. ...&#10;3. ..." aria-describedby="err-steps">${escapeHtml(newDefectDraft.steps || '')}</textarea>
          <div class="field-error" id="err-steps" style="display:none;"></div>
        </div>

        <h3 class="card-title" style="margin-top:var(--space-4);">Additional details</h3>
        <p class="field-hint" style="margin-top:-6px; margin-bottom:var(--space-3);">Optional — the defect can be created without these.</p>
        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="nd-expected">Expected result</label>
            <textarea class="textarea" id="nd-expected" placeholder="What should happen instead?">${escapeHtml(newDefectDraft.expected || '')}</textarea>
          </div>
          <div class="field">
            <label class="field-label" for="nd-actual">Actual result</label>
            <textarea class="textarea" id="nd-actual" placeholder="What actually happens?">${escapeHtml(newDefectDraft.actual || '')}</textarea>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="nd-environment">Environment / build version</label>
          <input class="input" id="nd-environment" type="text" placeholder="e.g. iOS 17.4, Safari, build 4.12.0" value="${escapeHtml(newDefectDraft.environment || '')}" />
        </div>

        <div style="display:flex; gap:var(--space-2); margin-top:var(--space-2);">
          <button type="submit" class="btn btn-primary" id="btn-submit-defect">Submit defect report</button>
          <button type="button" class="btn btn-secondary" data-nav="0">Cancel</button>
        </div>
      </form>
    </div>`;

  $('new-defect-form').addEventListener('submit', onSubmitNewDefect);
}

function successStateHtml(d) {
  const optionalRow = (label, value) => `
    <div class="readonly-row"><span class="readonly-label">${label}</span><span class="readonly-value${value ? '' : ' muted'}">${value ? escapeHtml(value) : 'Not set'}</span></div>`;
  return `
    <!-- State: success -->
    <div class="banner banner-success"><span class="banner-icon">&#10003;</span><div><strong>Defect created</strong>Defect <span style="font-family:var(--font-family-mono)">${d.id}</span> was logged and is ready for QA to triage.</div></div>
    <div class="card" style="max-width:720px;">
      <h3 class="card-title">${escapeHtml(d.title)}</h3>
      <div class="readonly-row"><span class="readonly-label">Defect ID</span><span class="readonly-value mono">${d.id}</span></div>
      <div class="readonly-row"><span class="readonly-label">Status</span><span class="readonly-value">${statusChip(d.status)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Severity</span><span class="readonly-value">${severityTag(d.severity)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Reported by</span><span class="readonly-value">${escapeHtml(d.reporter)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Created</span><span class="readonly-value">${fmtDateTime(d.createdAt)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Description</span><span class="readonly-value">${escapeHtml(d.description)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Steps to reproduce</span><span class="readonly-value">${escapeHtml(d.steps)}</span></div>
      ${optionalRow('Expected result', d.expected)}
      ${optionalRow('Actual result', d.actual)}
      ${optionalRow('Environment / build version', d.environment)}
      <div style="margin-top:var(--space-4); display:flex; gap:var(--space-2);">
        <button class="btn btn-primary" id="btn-view-in-list">View in Defects list</button>
        <button class="btn btn-secondary" id="btn-report-another">+ Report another defect</button>
      </div>
    </div>`;
}

async function onSubmitNewDefect(e) {
  e.preventDefault();

  /* State: unauthorized — authorization is checked before any field validation (AC6) */
  if (state.role !== 'reporter') {
    $('new-defect-summary-error').innerHTML = `
      <!-- State: unauthorized -->
      <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>You don't have permission to do that</strong>Reporting a defect requires the Reporter role. Ask a Reporter to submit this defect, or switch roles above.</div></div>`;
    showToast("Submission refused — Reporter role required.", 'danger');
    return;
  }

  const values = {
    title: $('nd-title').value.trim(),
    description: $('nd-description').value.trim(),
    severity: $('nd-severity').value,
    steps: $('nd-steps').value.trim(),
    expected: $('nd-expected').value.trim(),
    actual: $('nd-actual').value.trim(),
    environment: $('nd-environment').value.trim()
  };
  newDefectDraft = values;

  REQUIRED_FIELDS.forEach(f => {
    $('nd-' + f.key).classList.remove('has-error');
    $('err-' + f.key).style.display = 'none';
  });

  /* State: validation-error — each missing required field is named individually (AC2) */
  const missing = REQUIRED_FIELDS.filter(f => !values[f.key]);
  if (missing.length > 0) {
    missing.forEach(f => {
      $('nd-' + f.key).classList.add('has-error');
      const errEl = $('err-' + f.key);
      errEl.textContent = f.message;
      errEl.style.display = 'block';
    });
    const names = missing.map(f => f.label).join(', ');
    $('new-defect-summary-error').innerHTML = `
      <!-- State: validation-error -->
      <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>Can't submit this defect</strong>Missing required field${missing.length > 1 ? 's' : ''}: ${escapeHtml(names)}.</div></div>`;
    $('nd-' + missing[0].key).focus();
    return;
  }

  $('new-defect-summary-error').innerHTML = '';

  /* State: submitting */
  const btn = $('btn-submit-defect');
  btn.disabled = true; btn.textContent = 'Submitting…';
  await wait(300);

  /* State: success — status is New (AC5); blank optional fields are allowed (AC3) */
  const id = 'DEF-' + (DEFECT_FIXTURES.nextIdNumber++);
  const newDefect = {
    id, title: values.title, severity: values.severity, status: 'New',
    reporter: reporterName(state.role), createdAt: new Date().toISOString(),
    description: values.description, steps: values.steps,
    expected: values.expected, actual: values.actual, environment: values.environment
  };
  DEFECT_FIXTURES.defects.unshift(newDefect);

  btn.disabled = false; btn.textContent = 'Submit defect report';
  renderNewDefectScreen(newDefect);
  renderList(false);
  showToast(`Defect ${id} created with status New.`);
}

/* ============================================================
   Initial render
   ============================================================ */
renderList(true);
setTimeout(() => renderList(false), 260);
resetNewDefectForm();
show(0);
</script>
</body>
</html>
