<!--
  UAT-14OCT-STORY-034: Defect Detail View & Edit
  App nav: left sidebar (Defects) + top bar — same console pattern as the rest of this product
  (see UAT-14OCT-STORY-033, Defect Creation). This prototype continues DEF-241, the defect
  created in that story, so a reviewer can see the same record move through its lifecycle.
  Standalone, self-contained prototype. All data lives in the DEFECT_RECORD script block and
  is mutated only in memory (no network, no localStorage).

  Design decisions worth flagging for reviewers:
  - "Signed in as" and "Defect status" are prototype-only controls (title="Design-review only")
    that let a reviewer drive every ACID state without a real backend. They are not proposed
    product UI.
  - Priority is never editable from this screen in any role. The work item's scope explicitly
    excludes status/workflow actions, and priority is assigned by the triage workflow — so it
    is always shown read-only here. That also makes AC7 (priority unchanged when severity
    changes) true by construction rather than by a special case.
  - Reporters can edit Description and Steps to reproduce only before Triaged (AC2/AC3).
    Admins gain edit rights to those same two fields once the defect enters Triaged (AC5) —
    editing rights hand off from Reporter to Admin at the triage boundary. Severity stays
    editable by Admins at any status (AC4). No status control exists anywhere in the edit
    form, for any role (AC8).
-->

<script>
/* ============================================================
   Fixture data — continues DEF-241 from Defect Creation
   (UAT-14OCT-STORY-033). Everything lives in memory; nothing
   is persisted or sent over the network.
   ============================================================ */
const DEFECT_RECORD = {
  id: 'DEF-241',
  title: 'Checkout button unresponsive on Safari',
  reporter: 'Jordan Blake',
  createdAt: '2026-10-13T09:15:00',
  updatedAt: '2026-10-13T09:15:00',
  severity: 'Critical',
  description: 'Tapping "Place order" does nothing in Safari on iOS; no error and no network request fires.',
  steps: '1. Add any item to the cart\n2. Go to checkout\n3. Fill in payment details\n4. Tap "Place order" on Safari iOS',
  expected: 'The order is placed and the confirmation screen appears.',
  actual: 'Nothing happens. No error message, no loading state.',
  environment: 'iOS 17.4, Safari, production'
};

/* Status, priority and assignee are driven by the "Defect status" demo control rather than
   stored per-role, since they belong to the defect's workflow (out of this story's scope). */
const STATUS_WORKFLOW = {
  New: { priority: '', assignee: '' },
  Triaged: { priority: 'P2', assignee: 'Marcus Webb' }
};

const SEVERITIES = [
  { value: 'Critical', icon: '⛔', cls: 'sev-critical' },
  { value: 'High', icon: '▲', cls: 'sev-high' },
  { value: 'Medium', icon: '◆', cls: 'sev-medium' },
  { value: 'Low', icon: '▽', cls: 'sev-low' }
];

let state = { role: 'reporter', status: 'New' };

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtDateTime(iso) { const d = new Date(iso); return d.toLocaleString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function severityMeta(value) { return SEVERITIES.find(s => s.value === value) || SEVERITIES[2]; }
function severityTag(value) {
  const s = severityMeta(value);
  return `<span class="severity-tag ${s.cls}"><span aria-hidden="true">${s.icon}</span>${s.value}</span>`;
}
function statusChip(value) { return `<span class="chip chip-neutral">${escapeHtml(value)}</span>`; }

function showToast(message, type) {
  const wrap = $('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'danger' ? ' toast-danger' : '');
  el.textContent = message;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 220); }, 3400);
}

function sidebarHtml() {
  return `
    <div class="sidebar-section-label">QA Tracker</div>
    <a class="sidebar-link is-active" data-nav="0">Defects</a>
  `;
}

/* ============================================================
   Screen navigation (reviewer bar)
   ============================================================ */
const screens = Array.from(document.querySelectorAll('.screen'));
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(screens.length - 1, i));
  screens.forEach((s, j) => s.style.display = j === cur ? 'block' : 'none');
  document.getElementById('screen-label').textContent = `${cur + 1} / ${screens.length}: ${screens[cur].dataset.name}`;
  window.scrollTo(0, 0);
  if (cur === 0) renderDetail(false);
  if (cur === 1) renderEdit();
}
document.getElementById('prev-btn').onclick = () => show(cur - 1);
document.getElementById('next-btn').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { show(parseInt(nav.dataset.nav, 10)); }
});

/* ============================================================
   "Signed in as" / "Defect status" demo controls (synced across
   both screens so a reviewer's choice carries through Edit).
   ============================================================ */
function syncControls() {
  ['role-select-1', 'role-select-2'].forEach(id => { const el = $(id); if (el) el.value = state.role; });
  ['status-select-1', 'status-select-2'].forEach(id => { const el = $(id); if (el) el.value = state.status; });
}
['role-select-1', 'role-select-2'].forEach(id => {
  document.addEventListener('change', e => {
    if (e.target.id === id) { state.role = e.target.value; syncControls(); renderDetail(false); renderEdit(); }
  });
});
['status-select-1', 'status-select-2'].forEach(id => {
  document.addEventListener('change', e => {
    if (e.target.id === id) { state.status = e.target.value; syncControls(); renderDetail(false); renderEdit(); }
  });
});

/* ============================================================
   Screen 1: Defect Detail
   ============================================================ */
function detailRows() {
  const wf = STATUS_WORKFLOW[state.status];
  const d = DEFECT_RECORD;
  const optionalRow = (label, value) => `
    <div class="readonly-row"><span class="readonly-label">${label}</span><span class="readonly-value text-left${value ? '' : ' muted'}">${value ? escapeHtml(value) : 'Not set'}</span></div>`;
  return `
    <div class="card" style="max-width:720px;">
      <h3 class="card-title">${escapeHtml(d.title)}</h3>
      <div class="readonly-row"><span class="readonly-label">Defect ID</span><span class="readonly-value mono">${d.id}</span></div>
      <div class="readonly-row"><span class="readonly-label">Status</span><span class="readonly-value">${statusChip(state.status)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Severity</span><span class="readonly-value">${severityTag(d.severity)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Priority</span><span class="readonly-value${wf.priority ? '' : ' muted'}">${wf.priority ? escapeHtml(wf.priority) : 'Not set'}<span class="readonly-hint">Set by the triage workflow</span></span></div>
      <div class="readonly-row"><span class="readonly-label">Assignee</span><span class="readonly-value${wf.assignee ? '' : ' muted'}">${wf.assignee ? escapeHtml(wf.assignee) : 'Not assigned'}</span></div>
      <div class="readonly-row"><span class="readonly-label">Reporter</span><span class="readonly-value">${escapeHtml(d.reporter)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Created</span><span class="readonly-value">${fmtDateTime(d.createdAt)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Last updated</span><span class="readonly-value">${fmtDateTime(d.updatedAt)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Description</span><span class="readonly-value text-left">${escapeHtml(d.description)}</span></div>
      <div class="readonly-row"><span class="readonly-label">Steps to reproduce</span><span class="readonly-value text-left">${escapeHtml(d.steps)}</span></div>
      ${optionalRow('Expected result', d.expected)}
      ${optionalRow('Actual result', d.actual)}
      ${optionalRow('Environment / build version', d.environment)}
    </div>`;
}

function renderDetail(loading) {
  $('sidebar-detail').innerHTML = sidebarHtml();
  $('detail-error').style.display = 'none';
  $('detail-error').innerHTML = '';
  if (loading) {
    /* State: loading */
    $('detail-body').innerHTML = `
      <div class="card" style="max-width:720px;">
        <div class="skeleton" style="width:60%; height:20px;"></div>
        ${Array.from({ length: 7 }).map(() => '<div class="skeleton"></div>').join('')}
      </div>`;
    return;
  }
  /* State: success */
  $('detail-body').innerHTML = detailRows();
}

$('btn-simulate-detail-error').addEventListener('click', () => {
  /* State: error */
  $('detail-body').innerHTML = '';
  $('detail-error').style.display = 'block';
  $('detail-error').innerHTML = `
    <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>Couldn't load this defect</strong>Something went wrong fetching DEF-241. <a href="#" id="btn-retry-detail" style="color:inherit;text-decoration:underline;">Try again</a>.</div></div>`;
  $('btn-retry-detail').addEventListener('click', (e) => { e.preventDefault(); renderDetail(true); setTimeout(() => renderDetail(false), 260); });
});

$('btn-edit-defect').addEventListener('click', () => {
  if (state.role === 'viewer') { showToast("Edit refused — you don't have permission to change this defect.", 'danger'); }
  show(1);
});

/* ============================================================
   Screen 2: Edit Defect
   ============================================================ */
function readonlyField(label, valueHtml) {
  return `<div class="readonly-row"><span class="readonly-label">${label}</span><span class="readonly-value">${valueHtml}</span></div>`;
}

function renderEdit() {
  $('sidebar-edit').innerHTML = sidebarHtml();
  const d = DEFECT_RECORD;
  const wf = STATUS_WORKFLOW[state.status];
  const isTriaged = state.status === 'Triaged';

  if (state.role === 'viewer') {
    /* State: unauthorized (AC6) */
    $('edit-body').innerHTML = `
      <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>You don't have permission to do that</strong>Editing DEF-241 is limited to its reporter, Jordan Blake (before it's triaged), or an Admin. Ask one of them to make this change.</div></div>
      <div class="card" style="max-width:720px;">
        <h3 class="card-title">${escapeHtml(d.title)}</h3>
        ${readonlyField('Status', statusChip(state.status))}
        ${readonlyField('Severity', severityTag(d.severity))}
        ${readonlyField('Priority', wf.priority ? escapeHtml(wf.priority) : '<span class="muted">Not set</span>')}
        <div class="field" style="margin-top:var(--space-3);">
          <label class="field-label" for="ed-description-viewer">Description</label>
          <textarea class="textarea" id="ed-description-viewer" disabled>${escapeHtml(d.description)}</textarea>
        </div>
        <div class="field">
          <label class="field-label" for="ed-steps-viewer">Steps to reproduce</label>
          <textarea class="textarea" id="ed-steps-viewer" disabled>${escapeHtml(d.steps)}</textarea>
        </div>
        <button class="btn btn-secondary" data-nav="0">Back to defect</button>
      </div>`;
    return;
  }

  if (state.role === 'reporter' && isTriaged) {
    /* State: locked-for-reporter (AC3) */
    $('edit-body').innerHTML = `
      <div class="banner banner-warning"><span class="banner-icon">&#128274;</span><div><strong>Locked after triage</strong>DEF-241 has entered Triaged, so its description and reproduction details can no longer be changed by the reporter. Ask an Admin to update them.</div></div>
      <div class="card" style="max-width:720px;">
        <h3 class="card-title">${escapeHtml(d.title)}</h3>
        ${readonlyField('Status', statusChip(state.status))}
        ${readonlyField('Severity', severityTag(d.severity))}
        ${readonlyField('Priority', wf.priority ? escapeHtml(wf.priority) : '<span class="muted">Not set</span>')}
        ${readonlyField('Assignee', wf.assignee ? escapeHtml(wf.assignee) : '<span class="muted">Not assigned</span>')}
        <div class="field" style="margin-top:var(--space-3);">
          <label class="field-label field-lock" for="ed-description-locked">&#128274; Description</label>
          <textarea class="textarea" id="ed-description-locked" disabled>${escapeHtml(d.description)}</textarea>
        </div>
        <div class="field">
          <label class="field-label field-lock" for="ed-steps-locked">&#128274; Steps to reproduce</label>
          <textarea class="textarea" id="ed-steps-locked" disabled>${escapeHtml(d.steps)}</textarea>
        </div>
        <button class="btn btn-secondary" data-nav="0">Back to defect</button>
      </div>`;
    return;
  }

  if (state.role === 'reporter') {
    /* State: editable-for-reporter (AC2) */
    $('edit-body').innerHTML = `
      <div id="edit-reporter-banner"></div>
      <div class="card" style="max-width:720px;">
        <h3 class="card-title">${escapeHtml(d.title)}</h3>
        ${readonlyField('Status', statusChip(state.status))}
        ${readonlyField('Severity', severityTag(d.severity))}
        ${readonlyField('Priority', wf.priority ? escapeHtml(wf.priority) : '<span class="muted">Not set</span>')}
        <p class="field-hint" style="margin:var(--space-3) 0 0;">You can edit the description and reproduction details until this defect is triaged.</p>
        <form id="reporter-edit-form">
          <div class="field" style="margin-top:var(--space-2);">
            <label class="field-label" for="ed-description">Description<span class="required-mark">*</span></label>
            <textarea class="textarea" id="ed-description">${escapeHtml(d.description)}</textarea>
            <div class="field-error" id="err-ed-description" style="display:none;"></div>
          </div>
          <div class="field">
            <label class="field-label" for="ed-steps">Steps to reproduce<span class="required-mark">*</span></label>
            <textarea class="textarea" id="ed-steps">${escapeHtml(d.steps)}</textarea>
            <div class="field-error" id="err-ed-steps" style="display:none;"></div>
          </div>
          <div style="display:flex; gap:var(--space-2); margin-top:var(--space-2);">
            <button type="submit" class="btn btn-primary" id="btn-save-reporter">Save changes</button>
            <button type="button" class="btn btn-secondary" data-nav="0">Cancel</button>
          </div>
        </form>
      </div>`;
    $('reporter-edit-form').addEventListener('submit', onSubmitReporterEdit);
    return;
  }

  /* role === 'admin' */
  /* State: editable-for-admin (AC4, AC5, AC7, AC8) */
  const descLocked = !isTriaged;
  $('edit-body').innerHTML = `
    <div id="edit-admin-banner"></div>
    <div class="card" style="max-width:720px;">
      <h3 class="card-title">${escapeHtml(d.title)}</h3>
      ${readonlyField('Status', statusChip(state.status) + '<span class="readonly-hint">Status changes aren\'t made here — use the defect\'s workflow actions.</span>')}
      ${readonlyField('Priority', (wf.priority ? escapeHtml(wf.priority) : '<span class="muted">Not set</span>') + '<span class="readonly-hint">Set by the triage workflow — stays unchanged when you update severity.</span>')}
      ${readonlyField('Assignee', wf.assignee ? escapeHtml(wf.assignee) : '<span class="muted">Not assigned</span>')}
      <form id="admin-edit-form">
        <div class="field" style="margin-top:var(--space-3);">
          <label class="field-label" for="ed-severity">Severity<span class="required-mark">*</span></label>
          <select class="select" id="ed-severity">
            ${SEVERITIES.map(s => `<option value="${s.value}" ${d.severity === s.value ? 'selected' : ''}>${s.value}</option>`).join('')}
          </select>
          <p class="field-hint">Admins can change severity at any status.</p>
        </div>
        <div class="field">
          <label class="field-label field-lock" for="ed-description-admin">${descLocked ? '&#128274; ' : ''}Description${descLocked ? '' : '<span class="required-mark">*</span>'}</label>
          <textarea class="textarea" id="ed-description-admin" ${descLocked ? 'disabled' : ''}>${escapeHtml(d.description)}</textarea>
          <div class="field-error" id="err-ed-description-admin" style="display:none;"></div>
          ${descLocked ? '<p class="field-hint">Becomes editable for Admins once this defect is triaged.</p>' : ''}
        </div>
        <div class="field">
          <label class="field-label field-lock" for="ed-steps-admin">${descLocked ? '&#128274; ' : ''}Steps to reproduce${descLocked ? '' : '<span class="required-mark">*</span>'}</label>
          <textarea class="textarea" id="ed-steps-admin" ${descLocked ? 'disabled' : ''}>${escapeHtml(d.steps)}</textarea>
          <div class="field-error" id="err-ed-steps-admin" style="display:none;"></div>
        </div>
        <div style="display:flex; gap:var(--space-2); margin-top:var(--space-2);">
          <button type="submit" class="btn btn-primary" id="btn-save-admin">Save changes</button>
          <button type="button" class="btn btn-secondary" data-nav="0">Cancel</button>
        </div>
      </form>
    </div>`;
  $('admin-edit-form').addEventListener('submit', onSubmitAdminEdit);
}

async function onSubmitReporterEdit(e) {
  e.preventDefault();
  const values = { description: $('ed-description').value.trim(), steps: $('ed-steps').value.trim() };

  ['description', 'steps'].forEach(k => {
    $('ed-' + k).classList.remove('has-error');
    $('err-ed-' + k).style.display = 'none';
  });
  const missing = [];
  if (!values.description) missing.push({ key: 'description', label: 'Description' });
  if (!values.steps) missing.push({ key: 'steps', label: 'Steps to reproduce' });
  if (missing.length > 0) {
    /* State: validation-error */
    missing.forEach(f => {
      $('ed-' + f.key).classList.add('has-error');
      const errEl = $('err-ed-' + f.key);
      errEl.textContent = `${f.label} can't be empty.`;
      errEl.style.display = 'block';
    });
    $('edit-reporter-banner').innerHTML = `
      <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>Can't save this change</strong>Missing required field${missing.length > 1 ? 's' : ''}: ${missing.map(f => f.label).join(', ')}.</div></div>`;
    $('ed-' + missing[0].key).focus();
    return;
  }

  $('edit-reporter-banner').innerHTML = '';
  const btn = $('btn-save-reporter');
  btn.disabled = true; btn.textContent = 'Saving…';
  await wait(300);

  DEFECT_RECORD.description = values.description;
  DEFECT_RECORD.steps = values.steps;
  DEFECT_RECORD.updatedAt = new Date().toISOString();

  btn.disabled = false; btn.textContent = 'Save changes';
  /* State: success (AC2) */
  $('edit-reporter-banner').innerHTML = `
    <div class="banner banner-success"><span class="banner-icon">&#10003;</span><div><strong>Changes saved</strong>The description and reproduction details for DEF-241 have been updated.</div></div>`;
  showToast('DEF-241 updated.');
  renderDetail(false);
}

async function onSubmitAdminEdit(e) {
  e.preventDefault();
  const isTriaged = state.status === 'Triaged';
  const wf = STATUS_WORKFLOW[state.status];
  const values = { severity: $('ed-severity').value };
  let descriptionChanged = false;

  if (isTriaged) {
    values.description = $('ed-description-admin').value.trim();
    values.steps = $('ed-steps-admin').value.trim();

    ['description', 'steps'].forEach(k => {
      $('ed-' + k + '-admin').classList.remove('has-error');
      $('err-ed-' + k + '-admin').style.display = 'none';
    });
    const missing = [];
    if (!values.description) missing.push({ key: 'description', label: 'Description' });
    if (!values.steps) missing.push({ key: 'steps', label: 'Steps to reproduce' });
    if (missing.length > 0) {
      /* State: validation-error */
      missing.forEach(f => {
        $('ed-' + f.key + '-admin').classList.add('has-error');
        const errEl = $('err-ed-' + f.key + '-admin');
        errEl.textContent = `${f.label} can't be empty.`;
        errEl.style.display = 'block';
      });
      $('edit-admin-banner').innerHTML = `
        <div class="banner banner-danger"><span class="banner-icon">&#9888;</span><div><strong>Can't save this change</strong>Missing required field${missing.length > 1 ? 's' : ''}: ${missing.map(f => f.label).join(', ')}.</div></div>`;
      $('ed-' + missing[0].key + '-admin').focus();
      return;
    }
    descriptionChanged = values.description !== DEFECT_RECORD.description || values.steps !== DEFECT_RECORD.steps;
  }

  const severityChanged = values.severity !== DEFECT_RECORD.severity;
  $('edit-admin-banner').innerHTML = '';
  const btn = $('btn-save-admin');
  btn.disabled = true; btn.textContent = 'Saving…';
  await wait(300);

  DEFECT_RECORD.severity = values.severity;
  if (isTriaged) { DEFECT_RECORD.description = values.description; DEFECT_RECORD.steps = values.steps; }
  DEFECT_RECORD.updatedAt = new Date().toISOString();

  btn.disabled = false; btn.textContent = 'Save changes';

  /* State: success (AC4, AC5, AC7) */
  const parts = [];
  if (severityChanged) parts.push(`Severity updated to ${values.severity}.`);
  if (descriptionChanged) parts.push('Description and reproduction details updated.');
  if (parts.length === 0) parts.push('No fields were changed.');
  if (wf.priority) parts.push(`Priority remains ${wf.priority} — unchanged.`);

  $('edit-admin-banner').innerHTML = `
    <div class="banner banner-success"><span class="banner-icon">&#10003;</span><div><strong>Changes saved</strong>${parts.join(' ')}</div></div>`;
  showToast('DEF-241 updated.');
  renderDetail(false);
  renderEdit();
}

/* ============================================================
   Initial render
   ============================================================ */
syncControls();
renderDetail(true);
setTimeout(() => renderDetail(false), 260);
renderEdit();
show(0);
</script>
</body>
</html>
